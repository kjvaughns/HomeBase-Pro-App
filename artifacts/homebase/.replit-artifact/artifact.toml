kind = "mobile"
previewPath = "/"
title = "HomeBase"
version = "1.0.0"
id = "artifacts/homebase"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22119

[services.development]
run = "pnpm --filter @workspace/homebase run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homebase", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/homebase", "run", "serve" ]

[services.env]
PORT = "22119"
BASE_PATH = "/"
