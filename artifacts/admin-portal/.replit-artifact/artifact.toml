kind = "web"
previewPath = "/admin-portal/"
title = "HomeBase Admin Portal"
version = "1.0.0"
id = "artifacts/admin-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin-portal/" ]
localPort = 25580

[services.development]
run = "pnpm --filter @workspace/admin-portal run dev"

[services.production]
# BASE_PATH=/admin-portal/ → matches the static handler mount point
# VITE_API_URL must be set to the backend *origin* (no /api suffix)
# e.g. https://homebaseproapp.com  →  /api/auth/login resolves correctly
build = [ "sh", "-c", "BASE_PATH=/admin-portal/ VITE_API_URL=${VITE_API_URL} pnpm --filter @workspace/admin-portal run build" ]
publicDir = "artifacts/admin-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25580"
BASE_PATH = "/admin-portal/"
# VITE_API_URL: set to backend origin at deploy time.
# Example: https://homebaseproapp.com
# Leave empty in dev — /api/* routes via the Replit shared proxy.
VITE_API_URL = ""
